name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "winget/**", "*.md", "shots/**"]
  workflow_dispatch:

permissions:
  contents: write          # lets the workflow create the release + tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Build DragWheel.exe on Windows
  app:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path dragwheel.pyw -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        env:
          # Build PyInstaller's launcher from source on the runner instead of using the stock
          # prebuilt one. Antivirus engines often flag the shared stock launcher; a freshly
          # compiled one triggers far fewer false positives.
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install --no-binary pyinstaller pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name DragWheel
          --icon assets/dragwheel.ico --version-file version_info.txt --add-data "assets;assets"
          --collect-data imageio_ffmpeg --collect-binaries imageio_ffmpeg
          --collect-all pillow_heif --hidden-import win32timezone --hidden-import py7zr
          --hidden-import win32com.shell.shell --hidden-import editor --hidden-import jobproc --hidden-import pdfdocx --hidden-import updater --hidden-import theme --collect-submodules locales --hidden-import PySide6.QtMultimedia --hidden-import onnxruntime --collect-binaries onnxruntime --exclude-module sympy
          --exclude-module tkinter --exclude-module matplotlib --exclude-module cv2
          dragwheel.pyw
      - name: Trim unused Qt files
        run: |
          Remove-Item dist/DragWheel/_internal/PySide6/opengl32sw.dll -ErrorAction SilentlyContinue
          Remove-Item dist/DragWheel/_internal/PySide6/translations -Recurse -ErrorAction SilentlyContinue
      # Code signing through SignPath (free for open source). Runs only once the SignPath project exists and
      # the repository has the variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN (docs/CODE_SIGNING.md).
      - name: Upload the app for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/DragWheel
          retention-days: 1
      - name: Sign DragWheel.exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'DragWheel' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/DragWheel
      - name: Zip portable
        run: Compress-Archive -Path dist/DragWheel -DestinationPath DragWheel-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/DragWheel
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: DragWheel-portable.zip
          retention-days: 7

  # 2) Build the installer with Linux NSIS (it ships the 64-bit stubs; the Windows build does not)
  installer:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist/DragWheel
      - uses: actions/download-artifact@v4
        with:
          name: portable
          path: dist
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build installer
        run: |
          cd installer
          makensis -V2 -DDISTDIR="$GITHUB_WORKSPACE/dist/DragWheel" dragwheel.nsi
          ls -la ../dist
      - name: Upload the installer for signing
        id: unsigned_setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: dist/DragWheel-Setup-*.exe
          retention-days: 1
      - name: Sign the installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'DragWheel' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned_setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: DragWheel-windows
          path: |
            dist/DragWheel-Setup-*.exe
            dist/DragWheel-portable.zip
      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ needs.app.outputs.version }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v${{ needs.app.outputs.version }} already exists - not replacing its files (bump VERSION to publish)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes (from CHANGELOG.md)
        env:
          VERSION: ${{ needs.app.outputs.version }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          {
            echo "**Drag a file, tap a key, drop it on the wheel.** Offline file converter and toolbox for Windows."
            echo
            echo "**Install:** download \`DragWheel-Setup-$VERSION.exe\` below and run it (asks for admin, installs to \`C:\\Program Files\\DragWheel\`)."
            if [ "$SIGNED" = "true" ]; then echo "The installer and app are code-signed."; else
              echo "Windows SmartScreen may warn because the installer is not code-signed yet — choose *More info → Run anyway*."; fi
            echo
            echo "**Portable:** \`DragWheel-portable.zip\` — unzip anywhere and run \`DragWheel.exe\`."
            echo
            echo "Requires Windows 10 (1809+) or 11, 64-bit."
            echo
            echo "## What's new in $VERSION"
            awk -v head="## $VERSION" 'index($0, head) == 1 {on = 1; next} /^## / {if (on) exit} on' CHANGELOG.md | sed 's/^### /#### /'
          } > release_notes.md
          cat release_notes.md
      - name: Release
        # publishes v<VERSION> from main once; an existing release is never overwritten, so its
        # checksum (used by the winget listing and the in-app updater) stays the same
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.exists.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.app.outputs.version }}
          name: DragWheel ${{ needs.app.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release_notes.md
          files: |
            dist/DragWheel-Setup-*.exe
            dist/DragWheel-portable.zip
