name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # lets the workflow create the release + tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path dragwheel.pyw -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name DragWheel
          --icon assets/dragwheel.ico --version-file version_info.txt --add-data "assets;assets"
          --collect-data imageio_ffmpeg --collect-binaries imageio_ffmpeg
          --collect-all pillow_heif --hidden-import win32timezone --hidden-import py7zr --hidden-import win32com.shell.shell
          --exclude-module tkinter --exclude-module matplotlib
          dragwheel.pyw
      - name: Trim unused Qt files
        run: |
          Remove-Item dist/DragWheel/_internal/PySide6/opengl32sw.dll -ErrorAction SilentlyContinue
          Remove-Item dist/DragWheel/_internal/PySide6/translations -Recurse -ErrorAction SilentlyContinue
      - name: Build installer
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer\dragwheel.nsi
      - name: Zip portable
        run: Compress-Archive -Path dist/DragWheel -DestinationPath dist/DragWheel-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DragWheel-windows
          path: |
            dist/DragWheel-Setup-*.exe
            dist/DragWheel-portable.zip
      - name: Release
        # publishes v<VERSION> from main (or from a pushed v* tag); re-running updates the same release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DragWheel ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Drag a file, tap a key, drop it on the wheel.** Offline file converter and toolbox for Windows.

            **Install:** download `DragWheel-Setup-${{ steps.ver.outputs.version }}.exe` below and run it (asks for admin, installs to `C:\Program Files\DragWheel`).
            Windows SmartScreen may warn because the installer isn't code-signed — choose *More info → Run anyway*.

            **Portable:** `DragWheel-portable.zip` — unzip anywhere and run `DragWheel.exe`.

            Requires Windows 10 (1809+) or 11, 64-bit. See the README for how to use it.
          files: |
            dist/DragWheel-Setup-*.exe
            dist/DragWheel-portable.zip
