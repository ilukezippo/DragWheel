<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root { color-scheme: light dark; --bg: #f6f7f8; --card: #fff; --ink: #1c1e22; --dim: #5d636d; --line: #d9dce1; }
@media (prefers-color-scheme: dark) { :root { --bg: #1f2024; --card: #2b2c30; --ink: #eceef1; --dim: #a2a8b2; --line: #3a3c42; } }
body { margin: 0; width: 300px; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
header img { width: 28px; height: 28px; }
header b { font-size: 16px; }
main { padding: 6px 16px 16px; }
button { width: 100%; border: 0; border-radius: 10px; padding: 11px 14px; background: #ff8c1a; color: #1b1206; font: 700 14px "Segoe UI", system-ui; cursor: pointer; }
button:hover { background: #ffa040; }
.tip { margin-top: 12px; color: var(--dim); font-size: 12.5px; }
.tip li { margin: 3px 0; }
#status { margin: 6px 0 12px; font-size: 12.5px; color: var(--dim); }
#status.bad { color: #e05246; }
a { color: #ff8c1a; }
</style></head>
<body>
<header><img src="icons/icon32.png" alt=""><b>DragWheel</b></header>
<main>
  <div id="status">Checking DragWheel…</div>
  <button id="play">Play this page in Float</button>
  <ul class="tip">
    <li>Right-click a <b>video, song or link</b> → <i>Play in DragWheel Float</i></li>
    <li>Right-click a <b>picture</b> → <i>Save image as…</i> PNG, JPG, WebP, AVIF, ICO, PDF…</li>
  </ul>
</main>
<script src="popup.js"></script>
</body></html>
